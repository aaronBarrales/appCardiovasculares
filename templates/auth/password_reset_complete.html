{% extends "base.html" %}

{% block title %}Contraseña actualizada – CardioApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-4 col-lg-5 col-md-6">

    <div class="card o-hidden border-0 shadow-lg my-5">
      <div class="card-body p-5">

        <div class="text-center mb-4">
          <h1 class="h4 text-gray-900 mb-2">Contraseña actualizada</h1>
          <p class="mb-0">
            Tu contraseña se ha cambiado correctamente.  
            Ahora puedes iniciar sesión con tus nuevas credenciales.
          </p>
        </div>

        <hr>

        <div class="text-center">
          <a href="{% url 'login' %}" class="btn btn-primary btn-block">
            Iniciar sesión
          </a>
        </div>

      </div>
    </div>

  </div>
</div>
{% endblock %}
