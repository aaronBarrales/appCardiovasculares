{% extends "doctor/dashboard.html" %}
{% block title %}Vista previa PDF – CardioApp{% endblock %}

{% block content %}
<div class="container-fluid">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0 text-gray-800">Vista previa PDF</h1>

    <div>
      <a class="btn btn-light btn-sm" href="{% url 'reportes:reporte_cita_web' cita.pk %}">Volver al reporte</a>
      <a class="btn btn-success btn-sm" href="{% url 'reportes:reporte_cita_pdf' cita.pk %}?download=1">Descargar PDF</a>
    </div>
  </div>

  <div class="card shadow">
    <div class="card-body p-0" style="height: 80vh;">
      <iframe
        src="{% url 'reportes:reporte_cita_pdf' cita.pk %}"
        style="width:100%; height:100%; border:0;"
        title="Vista previa PDF">
      </iframe>
    </div>
  </div>

</div>
{% endblock %}
