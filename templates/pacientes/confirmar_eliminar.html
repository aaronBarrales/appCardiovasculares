{% extends 'doctor/dashboard.html' %}

{% block title %}Eliminar paciente – CardioApp{% endblock %}

{% block content %}

<div class="d-sm-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0 text-gray-800">Eliminar paciente</h1>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">

        <div class="card shadow mb-4 border-left-danger">
            <div class="card-body">

                <h5 class="font-weight-bold text-danger mb-3">
                    ¿Estás seguro que deseas eliminar este paciente?
                </h5>

                <p class="mb-4">
                    Paciente: <strong>{{ object }}</strong><br>
                    <small class="text-muted">
                        Esta acción no se puede deshacer.
                    </small>
                </p>

                <form method="post" class="d-flex justify-content-between">
                    {% csrf_token %}

                    <a href="{% url 'pacientes:lista' %}" class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-danger">
                        Sí, eliminar
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
